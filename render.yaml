services:
  - type: web
    name: research-copilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: research-copilot-db
          property: connectionString
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: AI_ACCESS_MODE
        value: hybrid
      - key: AI_KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_GITHUB_AUTH_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: DAILY_RESEARCH_LIMIT
        value: "20"
      - key: DAILY_BYOK_RESEARCH_LIMIT
        value: "100"
      - key: DAILY_LOCAL_RESEARCH_LIMIT
        value: "50"
      - key: WORKSPACE_STORAGE_LIMIT_MB
        value: "250"

databases:
  - name: research-copilot-db
    plan: free
    databaseName: research
    user: research
    ipAllowList: []
