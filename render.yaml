services:
  - type: web
    name: research-copilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: research-copilot-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: REGISTRATION_MODE
        value: open
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OBJECT_STORAGE_DRIVER
        value: local
      - key: DATA_DIRECTORY
        value: /app/data
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: AI_ACCESS_MODE
        value: hybrid
      - key: AI_KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DAILY_RESEARCH_LIMIT
        value: "20"
      - key: DAILY_BYOK_RESEARCH_LIMIT
        value: "100"
      - key: DAILY_LOCAL_RESEARCH_LIMIT
        value: "50"
      - key: WORKSPACE_STORAGE_LIMIT_MB
        value: "250"

databases:
  - name: research-copilot-db
    plan: free
    databaseName: research
    user: research
    ipAllowList: []
