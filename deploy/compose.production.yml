services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/research
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-local}
      DATA_DIRECTORY: /app/data
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      AI_ACCESS_MODE: ${AI_ACCESS_MODE:-hybrid}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:?AI_KEY_ENCRYPTION_SECRET is required}
      DAILY_RESEARCH_LIMIT: ${DAILY_RESEARCH_LIMIT:-20}
      DAILY_BYOK_RESEARCH_LIMIT: ${DAILY_BYOK_RESEARCH_LIMIT:-100}
      DAILY_LOCAL_RESEARCH_LIMIT: ${DAILY_LOCAL_RESEARCH_LIMIT:-50}
      WORKSPACE_STORAGE_LIMIT_MB: ${WORKSPACE_STORAGE_LIMIT_MB:-250}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - research_appdata:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

volumes:
  research_pgdata:
  research_appdata:
  caddy_data:
  caddy_config:
